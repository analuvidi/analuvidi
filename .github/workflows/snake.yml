name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: analuvidi
          outputs: |
            dist/github-snake.svg?color_snake=D4AF37&color_dots=ebedf0,c6e48b,7bc96f,239a3b,196127
            dist/github-snake-dark.svg?palette=github-dark&color_snake=D4AF37&color_dots=161b22,0e4429,006d32,26a641,39d353
            dist/github-snake.gif?color_snake=D4AF37&color_dots=2D333B,355C4D,4E8F6E,79C99E,B7F0D8&color_background=161B22

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
